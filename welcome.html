<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="build-id" content="4.1.1.261118.1638">
  <meta charset="UTF-8">
  <title>StoryTileCraft</title>

  <script defer data-domain="storytilecraft.space,preview.storytilecraft.space,dev.storytilecraft.space"
    src="https://plausible.io/js/script.file-downloads.outbound-links.js"></script>


  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #fff);
      color: #333;
      overflow-x: hidden;
      padding: 20px;
    }

    /* title hero */
    .hero {
      text-align: center;
      padding: 60px 20px;
      max-width: 800px;
      margin: 0 auto;
      animation: fadeInUp 1s ease forwards;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 20px;
    }



    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto;
      animation: fadeInUp 1.2s ease forwards;
    }

    .tile {
      background: #fff;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      font-size: 1.2rem;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .tile:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bang {
      display: inline-block;
      color: #e91e63;
      font-weight: bold;
      animation: popIn 1s ease-out forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-20deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.1) rotate(5deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .collide {
      display: inline-block;
      color: #7e57c2;
      font-weight: bold;
      animation: shakeIn 1.2s ease-out forwards;
    }

    @keyframes shakeIn {
      0% {
        opacity: 0;
        transform: translateX(-40px);
      }

      40% {
        opacity: 1;
        transform: translateX(10px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(3px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .psychology,
    .art,
    .it {
      display: inline-block;
      animation: pulseColor 3s infinite ease-in-out;
    }

    .psychology {
      color: #4caf50;
      /* green */
      animation-delay: 0s;
    }

    .art {
      color: #ff9800;
      /* orange */
      animation-delay: 0.5s;
    }

    .it {
      color: #2196f3;
      /* blue */
      animation-delay: 1s;
    }

    @keyframes pulseColor {

      0%,
      100% {
        transform: scale(1);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.15);
        filter: brightness(1.4);
      }
    }

    /* tiles */
    #breadcrumbs {
      margin-bottom: 20px;
      margin-left: 15%;

      font-size: 1em;
    }

    #breadcrumbs span.crumb {
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    #breadcrumbs span.crumb:hover {
      background: #eee;
    }

    #breadcrumbs .arrow {
      margin-right: 8px;
    }

    .stage-block {
      margin-top: 30px;
    }

    .stage-label {
      font-weight: bold;
      font-size: 1.2em;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-left: 15%;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hidden {
      display: none;
    }

    .blurred {
      filter: blur(3px);
    }

    .tile {
      background: #f0f0f0;
      padding: 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .tile:hover {
      background: #ddd;
    }

    .selected {
      font-weight: bold;
      color: white;
    }

    .green.selected {
      background-color: #4caf50;
      border-color: #388e3c;
    }

    .blue.selected {
      background-color: #2196f3;
      border-color: #1976d2;
    }

    .orange.selected {
      background-color: #ff9800;
      border-color: #f57c00;
    }

    .purple.selected {
      background-color: #9c27b0;
      border-color: #7b1fa2;
    }

    .back-button {
      font-size: 0.9em;
      padding: 5px 10px;
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }

    .back-button:hover {
      background: #ddd;
    }

    div[name='go-block'] {
      display: none;
    }

    div[name='go-label'] {
      position: relative;
      left: 20%;
      margin-top: 40px;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      /* border: none;
      border-radius: 10px;
      background-color: #4caf50;
      color: white;
      cursor: pointer; */
    }

    button[name='go-button'] {
      position: relative;
      left: 20%;
      margin-top: 40px;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }

    button[name='go-button'].green {
      background-color: #4caf50;
    }

    button[name='go-button'].blue {
      background-color: #2196f3;
    }

    button[name='go-button'].orange {
      background-color: #ff9800;
    }

    button[name='go-button'].purple {
      background-color: #9c27b0;
    }
  </style>
</head>

<body>

  <!-- <h1>Welcome to StoryTileCraft!</h1> -->
  <section class="hero">
    <h1>
      <span class="bang">Bang!</span>
      This is the space where the three worlds of
      <strong class="psychology">Psychology</strong>+
      <strong class="art">Art</strong>+
      <strong class="it">IT</strong>
      <span class="collide">collide</span> into a common collaborative web platform —
      <strong>
        <span class="psychology">Story</span><span class="art">Tile</span><span class="it">Craft</span>
      </strong>!
    </h1>
  </section>

  <!-- 3 body problem canvas background promo -->
  <div>
    <div id="breadcrumbs"></div>
  </div>
  <!-- <div name="go-block">
    <div name="go-label">Go with:</div>
    <button name="go-button">Go!</button>
  </div> -->
  <div id="tile-container"></div>

  <div name="go-block">
    <div name="go-label">Go with:</div>
    <button name="go-button">Go!</button>
  </div>

  <script>

  <script src="welcome-data.js"></script>
  <script src="welcome.js"></script>
</body>

</html>
