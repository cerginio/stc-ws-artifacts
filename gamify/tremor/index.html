<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="build-id" content="4.1.1.261118.1638">

    <link rel="icon" type="image/png" sizes="64x64" href="../../images/icons/favicon-64x64.png">
    
    

    <title>StoryTileCraft: Tremor</title>
    <script defer="" data-domain="storytilecraft.space,preview.storytilecraft.space,dev.storytilecraft.space" src="https://plausible.io/js/script.file-downloads.outbound-links.js"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: rgb(0, 0, 0);
        }

        html {
            position: relative;
            background-color: black;
            -webkit-overflow-scrolling: touch;
            overflow: hidden;
            overscroll-behavior: none;
        }

        * {
            touch-action: manipulation;
        }

        body {
            position: relative;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            outline: none;
            overflow-x: clip;
            overflow-y: clip;
            -webkit-overflow-scrolling: touch;
            touch-action: none;
        }

        .sliders {
            position: absolute;
            left: 20px;
            top: 160px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: none;
        }

        #custom-cursor .shield-cursor {
            display: none;
        }

        #custom-cursor.is-protection .tremor-cursor {
            display: none;
        }

        #custom-cursor.is-protection .shield-cursor {
            display: block;
        }

        .pop-button.active,
        .pop-button.activated {
            border: solid 2px #00cfff;
        }

        /* Mode buttons are a radio group with an off state, so they need to read at a glance,
           not through a 2px hairline. Three looks, and the selectors are specific enough
           (.mode-button.armed beats .pop-button.activated) that the result no longer depends
           on which rule happens to sit lower in the file.

           armed   — selected AND a tap fires it
           active  — selected but disarmed (click it again to arm)
           neither — not selected */
        .mode-button.active {
            border: solid 2px #7a8290;
            opacity: 0.55;
        }

        .mode-button.active.armed {
            border: solid 2px #1a9e63;
            background: #d8f3e5;
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(26, 158, 99, 0.22);
        }

        .mode-button.active.armed svg {
            stroke: #0d6b41;
        }
    </style>
<link rel="stylesheet" href="tremor-bundle-12aa36eaa7.css"></head>

<body>
    <div id="root-div">
        <canvas id="canvas" width="1024" height="720"></canvas>

        <!-- Custom cursor: default = tremor/impact icon; protection = shield -->
        <svg id="custom-cursor" viewBox="0 0 24 24">
            <g class="tremor-cursor" fill="none" stroke="#88ccff" stroke-width="1.5">
                <circle cx="12" cy="12" r="2" fill="#88ccff"></circle>
                <circle cx="12" cy="12" r="5" opacity="0.6"></circle>
                <circle cx="12" cy="12" r="9" opacity="0.3"></circle>
            </g>
            <g class="shield-cursor" stroke="#00cfff" fill="none">
                <path opacity="0.5" d="M3 10.4167C3 7.21907 3 5.62028 3.37752 5.08241C3.75503 4.54454 5.25832 4.02996 8.26491 3.00079L8.83772 2.80472C10.405 2.26824 11.1886 2 12 2C12.8114 2 13.595 2.26824 15.1623 2.80472L15.7351 3.00079C18.7417 4.02996 20.245 4.54454 20.6225 5.08241C21 5.62028 21 7.21907 21 10.4167C21 10.8996 21 11.4234 21 11.9914C21 17.6294 16.761 20.3655 14.1014 21.5273C13.38 21.8424 13.0193 22 12 22C10.9807 22 10.62 21.8424 9.89856 21.5273C7.23896 20.3655 3 17.6294 3 11.9914C3 11.4234 3 10.8996 3 10.4167Z" stroke-width="1.5"></path>
                <circle cx="12" cy="9" r="2" stroke="#1C274C" stroke-width="1.5"></circle>
                <path d="M16 15C16 16.1046 16 17 12 17C8 17 8 16.1046 8 15C8 13.8954 9.79086 13 12 13C14.2091 13 16 13.8954 16 15Z" stroke="#1C274C" stroke-width="1.5"></path>
            </g>
        </svg>

        <div class="sliders">
            <div class="c-range-slider blue-red">
                <input id="param-a" type="range" orient="vertical" min="1" max="5" value="2">
                <div class="c-range-slider__bar"></div>
                <div class="c-range-slider__thumb"></div>
            </div>

            <div class="c-range-slider green-yellow">
                <input id="param-b" type="range" orient="vertical" min="0.5" max="5" value="2">
                <div class="c-range-slider__bar"></div>
                <div class="c-range-slider__thumb"></div>
            </div>
        </div>
    </div>
